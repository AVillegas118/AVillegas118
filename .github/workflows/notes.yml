name: Comprobar ejemplos de las notas

on:
  push:
    paths:
      - '**.md'
      - 'tests/**'
      - '.github/workflows/notes.yml'
  pull_request:
    paths:
      - '**.md'
      - 'tests/**'
      - '.github/workflows/notes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar bibliotecas de los ejemplos
        run: python -m pip install requests beautifulsoup4 cryptography
      - name: Probar los ejemplos sin acceso a servicios externos
        run: python -m unittest discover -s tests -v
